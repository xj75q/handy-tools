syntax = "proto3";
option go_package="./;sayhello";
//package hello;

//protoc -go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative sayhello.proto
message HelloRequest{
  string msg = 1;
}

message HelloRespose{
  string msg = 1;
}

service Greeter{
  rpc SayHi(HelloRequest) returns(HelloRespose);
}